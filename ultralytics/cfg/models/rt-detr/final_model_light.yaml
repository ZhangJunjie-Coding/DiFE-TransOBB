
nc: 1
scales:
#  x: [1, 1, 1024 ]
  s: [ 0.5, 0.8, 1024 ]   # width=1.0, 不自动缩放, 手动控制所有通道

backbone:
  # [from, repeats, module, args]
  - [ -1, 1, HGStem, [ 32, 48 ] ] # 0-P2/4
  - [ -1, 6, HGBlock, [ 48, 128, 3 ] ] # stage 1

  - [ -1, 1, DWConv, [ 128, 3, 2, 1, False ] ] # 2-P3/8
  - [ -1, 6, HGBlock_DEConv, [ 96, 128, 3 ] ] # stage 2  (保留 DEConv, dim=128, 仅 ~1.1M)

  - [ -1, 1, DWConv, [ 256, 3, 2, 1, False ] ] # 4-P4/16  (512→256)
  - [ -1, 6, HGBlock_DEConv, [ 128, 256, 5, True, False ] ] # 保留 1 个 DEConv(256)
  - [ -1, 6, HGBlock_DEConv, [ 128, 256, 5, True, True ] ]          # 后面用 HGBlock
  - [ -1, 6, HGBlock_DEConv, [ 128, 256, 5, True, True ] ]          # stage 3

  - [ -1, 1, DWConv, [ 512, 3, 2, 1, False ] ] # 8-P5/32  (1024→512)
  - [ -1, 6, HGBlock_DEConv, [ 256, 512, 5, True, False ] ] # stage 4  (DEConv→HGBlock, 省 ~35M)

head:
  - [ -1, 1, Conv, [ 256, 1, 1, None, 1, 1, False ] ]  # 10 input_proj.2
  - [ -1, 1, AIFI, [ 1024, 8 ] ] # 11
  - [ -1, 1, Conv, [ 256, 1, 1 ] ]   # 12, Y5, lateral_convs.0

  - [ -1, 1, nn.Upsample, [ None, 2, 'nearest' ] ]
  - [ 7, 1, Conv, [ 256, 1, 1, None, 1, 1, False ] ]  # 14 input_proj.1
  - [ [ -2, -1 ], 1, Concat, [ 1 ] ]
  - [ -1, 3, RepC3_WTConv, [ 256 ] ]  # 16, fpn_blocks.0
  - [ -1, 1, Conv, [ 256, 1, 1 ] ]   # 17, Y4, lateral_convs.1

  - [ -1, 1, nn.Upsample, [ None, 2, 'nearest' ] ]
  - [ 3, 1, Conv, [ 256, 1, 1, None, 1, 1, False ] ]  # 19 input_proj.0
  - [ [ -2, -1 ], 1, Concat, [ 1 ] ]  # cat backbone P3
  - [ -1, 3, RepC3_WTConv, [ 256 ] ]    # X3 (21), fpn_blocks.1


  - [ -1, 1, nn.Upsample, [ None, 2, 'nearest' ] ] # 22
  - [ 1, 1, Conv, [ 256, 1, 1, None, 1, 1, False ] ]  # 23 input_proj.0
  - [ [ -2, -1 ], 1, Concat, [ 1 ] ]  # 24 cat backbone P2
  - [ -1, 3, RepC3_WTConv, [ 128 ] ]    # X3 (25), fpn_blocks.1


  - [ -1, 1, Conv, [ 256, 3, 2 ] ]   # 26, downsample_convs.0
  - [ [ -1, 21 ], 1, Concat, [ 1 ] ]  # 27 cat Y3
  - [ -1, 3, RepC3_WTConv, [ 256 ] ]    # F4 (28), pan_blocks.0

  - [ -1, 1, Conv, [ 256, 3, 2 ] ]   # 29, downsample_convs.1
  - [ [ -1, 17 ], 1, Concat, [ 1 ] ]  # 30 cat Y4
  - [ -1, 3, RepC3_WTConv, [ 256 ] ]    # F5 (31), pan_blocks.1

  - [ -1, 1, Conv, [ 256, 3, 2 ] ]   # 32, downsample_convs.1
  - [ [ -1, 12 ], 1, Concat, [ 1 ] ]  # 33 cat Y5
  - [ -1, 3, RepC3_WTConv, [ 256 ] ]    # F5 (34), pan_blocks.1

  - [ [ 25, 28, 31, 34 ], 1, RTDETRDecoder, [ nc ] ]  # Detect(P3, P4, P5)

